<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Desk</title>
<style>
  :root { --paper:#f7f3ec; --ink:#1e1b16; --muted:#8a8377; --rule:#e3dccf; --accent:#2f5d50; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); min-height:100vh; display:flex;
         align-items:center; justify-content:center;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .card { width:min(380px, 90vw); text-align:center; }
  h1 { font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:34px; letter-spacing:.01em; }
  .sub { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.14em; margin:10px 0 34px; }
  a.google { display:flex; align-items:center; justify-content:center; gap:10px;
             font-size:16px; font-weight:600; padding:13px; border-radius:8px;
             background:var(--ink); color:var(--paper); text-decoration:none; }
  a.google svg { width:18px; height:18px; background:#fff; border-radius:50%; padding:2px; }
  .note { color:var(--muted); font-size:13px; margin-top:18px; }
  .bad { color:#a04333; font-size:14px; margin-top:16px; display:none; text-align:left;
         background:#fffdf8; border:1px solid var(--rule); border-radius:8px; padding:10px 12px; }
  .rule { width:56px; height:1px; background:var(--ink); margin:18px auto 0; opacity:.35; }
</style>
</head>
<body>
  <div class="card">
    <h1>The Desk</h1>
    <div class="rule"></div>
    <div class="sub" id="sub">Private job queue</div>
    <a class="google" id="go" href="/api/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <div class="note">Only accounts on the list get in. Sign in with the Google address that was added for you.</div>
    <div class="bad" id="bad"></div>
  </div>
  <script>
    // What to say when a sign-in comes back refused. The callback redirects to
    // /login?error=<code> and writes the real reason to the function log; this
    // table is the other half of that split — generic to the person, specific
    // to the log. tests/gate.test.mjs fails if the callback can emit a code that
    // is missing here.
    var ERRORS = {
      not_allowed: 'That Google account is not on the list for this Desk. Sign in with the address that was added for you, or ask Mark to add this one.',
      bad_state: 'That sign-in took too long, or it started in a different browser. Start again from this page.',
      declined: 'Google did not complete the sign-in — it was cancelled or refused. Nothing has changed.',
      not_configured: 'Google sign-in is not set up on this deployment, so nobody can sign in until it is. The server log names the missing piece.',
      no_code: 'Google sent you back without a sign-in code. Try again.',
      exchange_failed: 'We could not confirm that sign-in with Google. Try again — the server log has the reason.',
      bad_token: "Google's answer did not check out, so the sign-in was refused. Try again."
    };
    var q = new URLSearchParams(location.search);
    var code = (q.get('error') || '').trim();
    if (code) {
      var el = document.getElementById('bad');
      // The code comes off a query string, which means it is somebody else's
      // text. It is echoed only when it looks like one of ours, and never at length.
      el.textContent = Object.prototype.hasOwnProperty.call(ERRORS, code) ? ERRORS[code]
        : (/^[a-z_]{1,32}$/.test(code) ? 'Sign-in failed (' + code + '). Try again.' : 'Sign-in failed. Try again.');
      el.style.display = 'block';
    }
    // Carry the requested page through the sign-in so /onboard links land there.
    // Same guard the server applies: a path on this site, no backslashes, no scheme.
    var nxt = q.get('next') || '';
    if (/^\/(?![/\\])[^\s\\:]*$/.test(nxt)) {
      document.getElementById('go').href = '/api/auth/google?next=' + encodeURIComponent(nxt);
      if (nxt.indexOf('/onboard') === 0) {
        document.getElementById('sub').textContent = 'Job search setup';
      }
    }
  </script>
</body>
</html>
