<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Desk</title>
<script>
  // Phones get the mobile companion; everything else gets the full Desk.
  var mobile = matchMedia('(max-width: 820px)').matches ||
               /iPhone|Android.*Mobile/i.test(navigator.userAgent);
  location.replace(mobile ? '/m' : '/desk');
</script>
</head>
<body>
  <noscript>
    <p><a href="/desk">Open The Desk (desktop)</a> · <a href="/m">Mobile version</a></p>
  </noscript>
</body>
</html>
