[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-assistant"
version = "0.1.0"
description = "Quality-over-spam job sourcing + application helper. The AI does the grind (find, filter, tailor); the human keeps the voice and the final click."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[project.scripts]
apply = "apply_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["apply_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Five of the six suites in tests/ are standalone scripts whose test functions
# are not named test_*; tests/test_script_suites.py drives their main() so one
# `pytest` run covers everything. Without it, `pytest tests/` reported
# "9 passed" while silently skipping 82 checks.
addopts = "-q"
filterwarnings = [
    # The old suites return a description string from each case instead of
    # asserting-and-returning-None. That is their reporting style, not a bug,
    # and the warning is noisy enough to bury real output.
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.ruff]
line-length = 110
target-version = "py39"
